<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mantenimiento AEP — Presentación de herramientas</title>
<meta name="description" content="Siete herramientas de Mantenimiento AEP: qué hace cada una, qué aporta y la página en funcionamiento.">
<style>
:root{
  --ink:#0A0D10; --panel:#12171B; --panel2:#171D22; --line:#232B31; --line2:#3A444C;
  --amber:#FFB020; --blue:#4FB0E8; --green:#35C97A; --mint:#8ECB93; --brand:#2F86B8;
  --text:#EDEFF1; --muted:#8A94A0; --gray:#6E7A85; --danger:#E8664F;
  --mono:Consolas,ui-monospace,'Cascadia Mono','SF Mono',Menlo,'Courier New',monospace;
  --disp:Bahnschrift,'DIN Alternate','Segoe UI Semibold',system-ui,-apple-system,Arial,sans-serif;
  --body:-apple-system,'Segoe UI',system-ui,Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#000;overflow:hidden;color:var(--text);font-family:var(--body)}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;background:var(--ink);overflow:hidden}
.ic{display:inline-flex;width:1em;height:1em;vertical-align:middle}.ic svg{width:100%;height:100%;fill:currentColor}
.mono{font-family:var(--mono)}

/* ── Slides ── */
.slide{position:absolute;inset:0;opacity:0;visibility:hidden;transform:translateX(60px);transition:opacity .55s ease,transform .55s ease,visibility 0s .55s}
.slide.active{opacity:1;visibility:visible;transform:none;transition:opacity .55s ease,transform .55s ease,visibility 0s}
.slide.past{transform:translateX(-60px)}
.rise{opacity:0}
.slide.active .rise{animation:rise .65s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i,0)*90ms + 150ms)}
@keyframes rise{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:none}}
@keyframes flip{from{opacity:0;transform:perspective(900px) rotateX(-70deg)}to{opacity:1;transform:perspective(900px) rotateX(0)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.dot{animation:pulse 1.6s ease-in-out infinite}

/* ── Chrome global (header + ruta) ── */
#hdr{position:absolute;left:72px;right:72px;top:46px;height:52px;display:flex;justify-content:space-between;align-items:center;font-family:var(--mono);font-size:24px;letter-spacing:.06em;font-weight:700;transition:opacity .4s}
#hdr .l{color:var(--amber);display:flex;align-items:center;gap:26px}
#hdr .home{font-family:var(--mono);font-size:20px;font-weight:700;letter-spacing:.06em;color:var(--text);background:transparent;border:2px solid var(--line2);border-radius:26px;height:46px;padding:0 22px;cursor:pointer;display:inline-flex;align-items:center;gap:12px;transition:all .2s}
#hdr .home:hover{border-color:var(--amber);color:var(--amber);transform:translateX(-3px)}
#track .lab{cursor:pointer;transition:color .2s}#track .lab:hover{color:var(--amber)} #hdr .r{color:var(--amber)}
.pill{display:inline-flex;align-items:center;gap:12px;height:52px;padding:0 30px;border-radius:26px;border:2px solid var(--c);background:color-mix(in srgb,var(--c) 14%,transparent);color:var(--c);font-family:var(--mono);font-size:22px;font-weight:700;letter-spacing:.08em;transition:all .4s}
.pill.amber{--c:var(--amber)}.pill.blue{--c:var(--blue)}.pill.green{--c:var(--green)}.pill.gray{--c:var(--gray)}
#track{position:absolute;left:0;right:0;bottom:0;height:110px;transition:opacity .4s}
#track .lab{position:absolute;left:72px;top:39px;font-family:var(--mono);font-size:20px;letter-spacing:.08em;color:var(--muted)}
#track .base{position:absolute;left:360px;top:54px;width:1440px;height:0;border-top:3px dashed var(--line2)}
#track .done{position:absolute;left:360px;top:52px;height:5px;width:0;background:var(--green);border-radius:3px;transition:width .8s cubic-bezier(.5,0,.2,1)}
#track .stop{position:absolute;top:44px;width:22px;height:22px;margin-left:-11px;border-radius:50%;border:3px solid var(--line2);background:var(--ink);cursor:pointer;transition:all .5s}
#track .stop.on{background:var(--green);border-color:var(--green)}
#track .stop:hover{transform:scale(1.4)}
#track .plane{position:absolute;top:21px;width:68px;height:68px;margin-left:-34px;border-radius:50%;background:var(--ink);border:4px solid var(--amber);display:flex;align-items:center;justify-content:center;color:var(--amber);font-size:32px;z-index:3;transition:left .8s cubic-bezier(.5,0,.2,1)}
.hide{opacity:0!important;pointer-events:none}

/* ── Portada y cierre ── */
.bgimg{position:absolute;inset:0;background-size:cover}
.cover .logo{position:absolute;left:115px;top:86px;width:158px}
.cover .eyebrow{position:absolute;left:115px;top:325px;font-family:var(--mono);font-size:24px;letter-spacing:.07em;font-weight:700;color:var(--mint)}
.cover h1{position:absolute;left:115px;top:385px;font-family:var(--disp);font-size:150px;line-height:.98;letter-spacing:-.01em;font-weight:700}
.cover .sub{position:absolute;left:115px;top:700px;width:860px;font-size:32px;line-height:1.35;color:#CFE3E6}
.cover .foot{position:absolute;left:115px;top:925px;font-family:var(--mono);font-size:22px;letter-spacing:.08em;color:#CFE3E6}
.bp{position:absolute;left:1130px;top:115px;width:717px;height:835px;border-radius:26px;background:#F3F7F8;color:var(--ink);box-shadow:0 30px 80px rgba(0,0,0,.45);padding:50px}
.bp .k{font-family:var(--mono);font-size:19px;letter-spacing:.06em;color:#5B6570}
.bp .brand{display:flex;gap:18px;align-items:center}.bp .brand img{width:90px}.bp .brand b{font-family:var(--mono);font-size:22px;letter-spacing:.08em;display:block;margin-bottom:6px}
.bp .route{display:flex;align-items:center;justify-content:space-between;margin-top:50px}
.bp .route h3{font-size:36px;line-height:1.1;margin-top:10px;max-width:260px}
.bp .route .ic{font-size:72px;color:var(--brand)}
.bp .fields{display:grid;grid-template-columns:1fr 1fr 1.2fr;gap:20px;margin-top:48px}
.bp .fields b{display:block;font-family:var(--mono);font-size:28px;margin-top:8px}
.bp .pax{margin-top:40px}.bp .pax b{display:block;font-size:32px;margin-top:8px}
.bp hr{border:0;border-top:3px dashed #A9B4BA;margin:40px -50px 0;position:relative}
.bp .scan{display:flex;gap:34px;align-items:center;margin-top:34px}
.bp .qrbox{flex:0 0 190px;height:190px;position:relative}
.bp .qrbox svg,.bp .qrbox img{width:100%;height:100%;display:block}
.bp .qrbox::before,.bp .qrbox::after{content:'';position:absolute;width:30px;height:30px;border:4px solid var(--brand)}
.bp .qrbox::before{left:-14px;top:-14px;border-right:0;border-bottom:0;border-radius:8px 0 0 0}
.bp .qrbox::after{right:-14px;bottom:-14px;border-left:0;border-top:0;border-radius:0 0 8px 0}
.bp .scan h3{font-size:34px;line-height:1.15;margin:8px 0 10px}
.bp .scan .u{font-family:var(--mono);font-size:17px;color:#5B6570;word-break:break-all;line-height:1.3}
.bp .scan .gate{display:inline-block;margin-top:14px;padding:6px 16px;border-radius:20px;border:2px solid var(--green);color:#168A4F;font-family:var(--mono);font-size:17px;font-weight:700;letter-spacing:.06em}
.close .logo{position:absolute;left:115px;top:86px;width:130px}
.close .eyebrow{position:absolute;left:115px;top:275px;font-family:var(--mono);font-size:24px;letter-spacing:.07em;font-weight:700;color:var(--mint)}
.close h1{position:absolute;left:115px;top:330px;width:1500px;font-family:var(--disp);font-size:100px;line-height:1.02;font-weight:700}
.close .cards{position:absolute;left:72px;right:72px;top:655px;display:grid;grid-template-columns:repeat(3,1fr);gap:36px}
.close .card{border-radius:20px;background:rgba(10,13,16,.62);border:2px solid rgba(255,255,255,.22);padding:42px 44px;height:240px}
.close .card h4{display:flex;gap:22px;align-items:center;font-family:var(--mono);font-size:30px;letter-spacing:.08em;color:var(--mint)}
.close .card .ic{font-size:52px}.close .card p{font-size:28px;line-height:1.35;margin-top:30px;color:#E4EEF0}
.close .foot{position:absolute;left:115px;top:985px;font-family:var(--mono);font-size:24px;color:#CFE3E6;letter-spacing:.06em}

/* ── Títulos comunes ── */
.h2{position:absolute;left:72px;top:120px;font-family:var(--disp);font-size:76px;font-weight:700;letter-spacing:-.01em}
.sub2{position:absolute;left:72px;top:216px;font-family:var(--mono);font-size:21px;letter-spacing:.08em;color:var(--muted)}
.sub2.big{font-family:var(--body);font-size:32px;letter-spacing:0;top:222px}

/* ── Itinerario ── */
.board{position:absolute;left:72px;right:72px;top:310px;border-radius:22px;background:var(--panel);border:2px solid var(--line);padding:18px 24px 26px}
.row{display:grid;grid-template-columns:90px 1fr 560px 150px 290px;align-items:center;height:80px;padding:0 24px;border-radius:12px;font-family:var(--mono);cursor:pointer;opacity:0;transition:background .2s}
.row:hover{background:rgba(255,176,32,.07)}
.slide.active .row{animation:flip .6s ease both;animation-delay:calc(var(--i)*110ms + 200ms)}
.row.head{height:62px;font-size:19px;letter-spacing:.1em;color:var(--muted);cursor:default}.row.head:hover{background:none}
.row .n{font-size:27px;color:var(--amber)} .row .d{font-size:30px;font-weight:700;letter-spacing:.02em}
.row .h{font-size:22px;color:var(--mint)} .row .g{font-size:29px;font-weight:700;color:var(--amber)}
.row.first{background:rgba(255,176,32,.09)}
.row .pill{height:46px;font-size:19px;padding:0 24px;justify-content:center;width:100%}

/* ── Tarjeta de embarque (pantallazo) ── */
.pass{position:absolute;left:72px;top:137px;width:1776px;height:806px;border-radius:22px;background:var(--panel);border:2px solid var(--line);display:grid;grid-template-columns:1fr 464px}
.pass .main{padding:40px 58px 0}
.pass .eyebrow{font-family:var(--mono);font-size:23px;letter-spacing:.08em;font-weight:700;color:var(--amber)}
.pass h2{font-family:var(--disp);font-size:88px;line-height:1.1;letter-spacing:-.01em;margin-top:6px}
.pass .tag{font-size:31px;color:var(--muted);margin-top:8px}
.pass .tl{font-family:var(--mono);font-size:19px;letter-spacing:.1em;color:var(--muted);margin:42px 0 18px}
.tiles{display:grid;grid-template-columns:repeat(var(--c),1fr);gap:28px}
.tile{background:var(--panel2);border:2px solid var(--line);border-radius:16px;transition:transform .25s,border-color .25s}
.tile:hover{transform:translateY(-4px);border-color:var(--line2)}
.tile.h{display:flex;align-items:center;gap:26px;padding:0 30px;height:188px}
.tile .circ{flex:0 0 96px;height:96px;border-radius:50%;background:var(--brand);display:flex;align-items:center;justify-content:center;font-size:44px;color:#fff}
.tile h4{font-size:34px}.tile.h p{font-size:28px;line-height:1.28;color:var(--muted);margin-top:8px}
.tile.v{padding:20px 26px;height:216px;display:flex;flex-direction:column}
.tile.v .ic{font-size:38px;color:var(--blue)}
.tile.v h4{font-size:29px;margin-top:auto;line-height:1.15}
.tile.v p{font-size:24px;color:var(--muted);margin-top:8px;line-height:1.25;min-height:60px}
.tile.v p b{color:var(--mint);font-size:26px}
.stub{position:relative;border-left:3px dashed var(--line2);padding:50px 58px}
.stub::before,.stub::after{content:'';position:absolute;left:-31px;width:60px;height:60px;border-radius:50%;background:var(--ink)}
.stub::before{top:-30px}.stub::after{bottom:-30px}
.stub .k{font-family:var(--mono);font-size:19px;letter-spacing:.1em;color:var(--muted)}
.stub .v{font-family:var(--mono);font-weight:700;margin:8px 0 38px}
.stub .gate{font-size:92px;color:var(--amber);line-height:1}.stub .st{font-size:34px;color:var(--green)}.stub .fl{font-size:44px}
.stub .url{font-family:var(--mono);font-size:22px;color:var(--blue);word-break:break-all;line-height:1.35;margin-top:8px}
.stub img{position:absolute;left:58px;right:58px;bottom:56px;width:calc(100% - 116px);opacity:.8}

/* ── Lo que aporta / mejoró ── */
.stats{position:absolute;left:72px;right:72px;top:305px;display:grid;grid-template-columns:repeat(4,1fr);gap:29px}
.stat{background:var(--panel);border:2px solid var(--line);border-radius:18px;height:224px;text-align:center;padding-top:34px}
.stat b{display:block;font-family:var(--mono);font-size:84px;color:var(--amber);line-height:1.1}
.stat span{display:block;font-size:27px;color:var(--muted);margin:14px 28px 0;line-height:1.25}
.adv{position:absolute;left:72px;right:72px;display:grid;grid-template-columns:1fr 1fr;gap:29px}
.adv .a{display:flex;align-items:center;gap:40px;padding:0 44px;background:var(--panel2);border:2px solid var(--line);border-radius:18px}
.adv .a .c{flex:0 0 var(--d);height:var(--d);border-radius:50%;border:2px solid var(--green);background:rgba(53,201,122,.18);display:flex;align-items:center;justify-content:center;color:var(--green);font-size:calc(var(--d)*.5)}
.adv h4{font-size:var(--t)}.adv p{font-size:28px;line-height:1.3;color:var(--muted);margin-top:10px}
.cmp{position:absolute;left:72px;right:72px;top:305px;display:grid;grid-template-columns:1fr 110px 1fr;align-items:center;gap:0}
.cmp .c{border-radius:18px;padding:26px 36px;height:176px;border:2px solid var(--line);background:var(--panel)}
.cmp .c.now{border-color:var(--amber);background:rgba(255,176,32,.1)}
.cmp .c .k{font-family:var(--mono);font-size:19px;letter-spacing:.1em;color:var(--muted)}.cmp .c.now .k{color:var(--amber);font-weight:700}
.cmp .c h4{font-size:30px;line-height:1.2;margin-top:10px}.cmp .c.old h4{color:#C3CAD0}
.cmp .c small{display:block;font-family:var(--mono);font-size:21px;color:var(--muted);margin-top:12px}.cmp .c.now small{color:var(--mint)}
.cmp .ar{text-align:center;font-size:62px;color:var(--amber)}
.mets{position:absolute;left:72px;right:72px;top:510px;display:grid;grid-template-columns:1fr 1fr;gap:26px}
.met{background:var(--panel);border:2px solid var(--line);border-radius:18px;padding:26px 34px;height:218px}
.met .t{display:flex;justify-content:space-between;align-items:baseline}.met .t b{font-size:30px}.met .t i{font-style:normal;font-family:var(--mono);font-size:40px;font-weight:700;color:var(--green)}
.br{display:grid;grid-template-columns:230px 1fr;align-items:center;margin-top:16px;font-size:26px}
.br span{color:var(--text)}.br span em{font-style:normal;color:var(--muted)}
.br .tr{height:40px}.br .bar{height:100%;border-radius:6px;background:var(--gray);width:var(--w);transition:width 1.1s cubic-bezier(.2,.7,.2,1) .5s}
.br.now .bar{background:var(--green)}
.slide:not(.active) .br .bar{width:0}
.foot2{position:absolute;left:72px;top:936px;font-family:var(--mono);font-size:20px;color:var(--muted)}

/* ── Cambio de destino ── */
.dep .tag{position:absolute;left:0;right:0;top:175px;text-align:center;font-family:var(--mono);font-size:32px;letter-spacing:.22em;font-weight:700;color:var(--amber)}
.dep .from{position:absolute;left:0;right:0;top:262px;text-align:center;font-family:var(--mono);font-size:26px;letter-spacing:.1em;color:var(--muted)}
.dep .from b{color:var(--text);font-weight:700}.dep .from i{font-style:normal;color:var(--green)}
.flap{position:absolute;left:0;right:0;top:345px;height:270px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px}
.flap .ln{display:flex;gap:7px}
.fl{width:72px;height:112px;border-radius:9px;border:2px solid var(--line2);background:linear-gradient(#1d252c 50%,#141a1f 50%);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-weight:700;font-size:90px;color:var(--text);position:relative;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.fl::after{content:'';position:absolute;left:0;right:0;top:50%;height:4px;margin-top:-2px;background:#05070a}
.fl.sp{width:34px;background:none;border:0;box-shadow:none}.fl.sp::after{display:none}
.fl.flip{animation:flapk .14s linear}
@keyframes flapk{0%{transform:scaleY(1)}50%{transform:scaleY(.12)}100%{transform:scaleY(1)}}
.dep .tagline{position:absolute;left:0;right:0;top:650px;text-align:center;font-size:34px;color:var(--muted)}
.dep .chips{position:absolute;left:0;right:0;top:760px;display:flex;justify-content:center;gap:28px}
.dep .chip{min-width:330px;text-align:center;padding:20px 34px;border-radius:16px;background:var(--panel);border:2px solid var(--line2);font-family:var(--mono);font-size:30px;font-weight:700;letter-spacing:.06em}
.dep .chip.g{color:var(--amber)}
/* ── Demo ── */
.browser{position:absolute;left:72px;top:215px;width:1215px;height:730px;border-radius:18px;background:var(--panel);border:3px solid var(--line2);overflow:hidden;display:flex;flex-direction:column}
.bt{flex:0 0 62px;display:flex;align-items:center;gap:16px;padding:0 22px;background:#1B2229}
.bt .d{width:17px;height:17px;border-radius:50%}
.bt .addr{flex:1;height:38px;border-radius:19px;background:var(--ink);border:2px solid var(--line);font-family:var(--mono);font-size:19px;color:var(--muted);display:flex;align-items:center;padding:0 20px;overflow:hidden;white-space:nowrap}
.seg{display:flex;border:2px solid var(--line2);border-radius:19px;overflow:hidden;height:38px}
.seg button{font-family:var(--mono);font-size:17px;letter-spacing:.06em;font-weight:700;color:var(--muted);background:transparent;border:0;padding:0 18px;cursor:pointer}
.seg button.on{background:var(--amber);color:var(--ink)}
.bt a{color:var(--muted);font-size:24px;display:flex}.bt a:hover{color:var(--amber)}
.bv{position:relative;flex:1;background:var(--ink)}
.bv img,.bv iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:none;background:#fff}
.bv img{object-fit:cover;object-position:top left;background:var(--ink)}
.bv.shot img{display:block}.bv.live iframe{display:block}
.bv .ld{position:absolute;inset:0;display:none;align-items:center;justify-content:center;font-family:var(--mono);font-size:22px;letter-spacing:.1em;color:var(--muted)}
.bv.live .ld{display:flex;z-index:0}.bv iframe{z-index:1}
.steps{position:absolute;left:1340px;top:215px;width:508px}
.steps .t{font-family:var(--mono);font-size:21px;letter-spacing:.1em;font-weight:700;color:var(--amber);margin-bottom:26px}
.step{display:flex;gap:22px;align-items:center;height:118px;font-size:29px;line-height:1.25}
.step i{flex:0 0 58px;height:58px;border-radius:50%;background:var(--amber);color:var(--ink);font-family:var(--mono);font-style:normal;font-weight:700;font-size:28px;display:flex;align-items:center;justify-content:center}
.cta{display:flex;gap:26px;align-items:center;margin-top:34px}
.cta a.go{display:inline-flex;align-items:center;gap:14px;height:78px;padding:0 28px;border-radius:16px;background:var(--green);color:var(--ink);text-decoration:none;font-family:var(--mono);font-weight:700;font-size:22px;letter-spacing:.04em;white-space:nowrap;transition:transform .2s}
.cta a.go:hover{transform:translateY(-3px)}
.cta .qr{width:150px;height:150px;background:#fff;border-radius:12px;padding:4px}
.cta button.go{cursor:pointer;border:0;display:inline-flex;align-items:center;gap:14px;height:78px;padding:0 26px;border-radius:16px;background:var(--green);color:var(--ink);font-family:var(--mono);font-weight:700;font-size:21px;letter-spacing:.03em;white-space:nowrap;transition:transform .2s,box-shadow .2s;box-shadow:0 0 0 0 rgba(53,201,122,.5);animation:glow 2.2s infinite}
.cta button.go:hover{transform:translateY(-3px)}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(53,201,122,.45)}50%{box-shadow:0 0 0 14px rgba(53,201,122,0)}}
.bv.shot img{cursor:zoom-in}
.enterhint{margin-top:18px;font-family:var(--mono);font-size:19px;color:var(--muted);letter-spacing:.04em}.enterhint b{color:var(--amber)}
/* Modo página: la herramienta real a pantalla completa */
#page{position:fixed;inset:0;z-index:20;background:var(--ink);display:none;flex-direction:column}
#page.on{display:flex}
.pbar{flex:0 0 56px;display:flex;align-items:center;gap:10px;padding:0 16px;background:#10161A;border-bottom:2px solid var(--line2);font-family:var(--mono);font-size:14px;letter-spacing:.06em}
.pbar .pt{color:var(--amber);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pbar .pt i{font-style:normal;color:var(--muted);margin:0 8px}
.pbar .sp{flex:1}
.pbar button,.pbar a{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 16px;border-radius:18px;border:1px solid var(--line2);background:transparent;color:var(--text);font-family:var(--mono);font-size:13px;font-weight:700;letter-spacing:.05em;text-decoration:none;cursor:pointer;white-space:nowrap}
.pbar button:hover,.pbar a:hover{border-color:var(--amber);color:var(--amber)}
.pbar .primary{background:var(--green);border-color:var(--green);color:var(--ink)}.pbar .primary:hover{color:var(--ink);filter:brightness(1.1)}
.pbody{position:relative;flex:1;background:var(--ink)}
.pbody iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff;display:none}.pbody iframe.on{display:block}
.pbody .ld{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:16px;letter-spacing:.1em;color:var(--muted)}
#pguide{position:absolute;left:16px;bottom:16px;width:360px;padding:18px 20px;border-radius:14px;background:rgba(10,13,16,.95);border:2px solid var(--amber);display:none;z-index:3}
#pguide.on{display:block}#pguide b.t{display:block;font-family:var(--mono);font-size:12px;letter-spacing:.1em;color:var(--amber);margin-bottom:10px}
#pguide div{display:flex;gap:12px;align-items:center;font-size:15px;line-height:1.3;margin-top:8px}#pguide i{flex:0 0 26px;height:26px;border-radius:50%;background:var(--amber);color:var(--ink);font-family:var(--mono);font-style:normal;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center}
body.inpage #nav,body.inpage #hint{display:none}

/* ── Navegación ── */
#nav{position:fixed;left:50%;top:10px;transform:translateX(-50%);z-index:10;display:flex;gap:8px;align-items:center;font-family:var(--mono);font-size:13px;color:var(--muted);opacity:.0;transition:opacity .3s}
body.moving #nav{opacity:.9}
#nav button{width:38px;height:38px;border-radius:50%;border:1px solid var(--line2);background:rgba(10,13,16,.85);color:var(--text);cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center}
#nav button:hover{border-color:var(--amber);color:var(--amber)}
#notes{position:absolute;left:72px;right:72px;bottom:120px;padding:26px 34px;border-radius:16px;background:rgba(10,13,16,.94);border:2px solid var(--amber);font-size:27px;line-height:1.4;color:var(--text);display:none;z-index:5}
#notes.on{display:block}#notes b{font-family:var(--mono);font-size:19px;letter-spacing:.1em;color:var(--amber);display:block;margin-bottom:10px}
#hint{position:absolute;left:115px;bottom:40px;white-space:nowrap;padding:16px 34px;border-radius:30px;background:rgba(10,13,16,.9);border:2px solid var(--line2);font-family:var(--mono);font-size:21px;letter-spacing:.05em;color:var(--muted);z-index:6;transition:opacity .6s}
#hint b{color:var(--amber)}
@media print{#nav{display:none}}
@media (prefers-reduced-motion:reduce){.slide,.rise,.row{animation:none!important;transition:none!important;opacity:1}.slide:not(.active){opacity:0}}
</style>
</head>
<body>
<div id="stage">
  <div id="slides"></div>
  <div id="hdr"><span class="l"></span><span class="r"></span></div>
  <div id="track"><span class="lab">RUTA MANT-AEP</span><div class="base"></div><div class="done"></div><div class="plane"></div></div>
  <div id="notes"></div>
  <div id="hint"><b>← →</b> navegar &nbsp;·&nbsp; <b>F</b> pantalla completa &nbsp;·&nbsp; <b>N</b> notas &nbsp;·&nbsp; <b>I</b> itinerario &nbsp;·&nbsp; <b>Enter</b> entrar</div>
</div>
<div id="page"><div class="pbar"><span class="pt"></span><span class="sp"></span>
  <button id="pguion" title="Mostrar el guion de la demo (G)">GUION</button>
  <a id="pext" target="_blank" rel="noopener">NUEVA PESTAÑA ↗</a>
  <button id="pitin" title="Ir al itinerario (I)">☰ ITINERARIO</button>
  <button id="pback" title="Volver (Esc)">← VOLVER A LA PRESENTACIÓN</button>
  <button id="pnext" class="primary">SIGUIENTE PARADA →</button></div>
  <div class="pbody"><div class="ld">CARGANDO PÁGINA…</div></div><div id="pguide"></div></div>
<div id="nav"><button id="prev" aria-label="Anterior">‹</button><span id="count"></span><button id="next" aria-label="Siguiente">›</button></div>

<script>/*QRLIB*/</script>
<script>
const DATA = /*DATA*/;
const ICONS = /*ICONS*/;
const { ROUTE, STOPS, TOTAL_STOPS } = DATA;
const ic = (n) => `<span class="ic">${ICONS[n] || ''}</span>`;
const pad = (n) => String(n).padStart(2, '0');
const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;');
const fmt = (n) => n.toLocaleString('es-AR');
const SHOTS = ['grilla', 'termo', 'bhs', 'recorrida'];   // paradas con captura real

/* ───────── Plantillas ───────── */
function cover() {
  return `<section class="slide cover" data-chrome="none">
    <div class="bgimg" style="background-image:url(assets/bg_cover.png)"></div>
    <img class="logo rise" style="--i:0" src="assets/logo_blanco.png" alt="Aeropuertos Argentina">
    <div class="eyebrow rise" style="--i:1"><span class="dot">●</span> EMBARQUE GENERAL — MANTENIMIENTO AEP</div>
    <h1 class="rise" style="--i:2">Bienvenidos<br>a bordo.</h1>
    <p class="sub rise" style="--i:3">${TOTAL_STOPS} herramientas, un solo recorrido: qué hace cada una, qué ventajas tiene y qué mejoró en el día a día.</p>
    <div class="foot rise" style="--i:4">AEROPARQUE JORGE NEWBERY &nbsp;·&nbsp; NOVIEMBRE 2026</div>
    <div class="bp rise" style="--i:3">
      <div class="brand"><img src="assets/logo_simbolo.png" alt=""><div><b>AEROPUERTOS ARGENTINA</b><span class="k">TARJETA DE EMBARQUE · BOARDING PASS</span></div></div>
      <div class="route"><div><span class="k">DESDE</span><h3>Datos dispersos</h3></div>${ic('FaPlane')}<div><span class="k">HACIA</span><h3>Un solo portal</h3></div></div>
      <div class="fields"><div><span class="k">FECHA</span><b>NOV 2026</b></div><div><span class="k">PARADAS</span><b>${pad(TOTAL_STOPS)}</b></div><div><span class="k">VUELO</span><b>MANT-AEP</b></div></div>
      <div class="pax"><span class="k">PASAJERO</span><b>Equipo de Mantenimiento AEP</b></div>
      <hr><div class="scan"><div class="qrbox" id="qrpres"><img src="assets/qr_presentacion.png" alt="Código QR para abrir la presentación"></div>
        <div><span class="k">ESCANEÁ PARA ABORDAR</span><h3>Abrí la presentación en tu celular</h3><div class="u" id="qrurl"></div><span class="gate">PUERTA WEB · ABIERTA</span></div></div>
    </div></section>`;
}

function itinerary() {
  const rows = ROUTE.map((r, i) => `<div class="row${i === 0 ? ' first' : ''}" style="--i:${i}" data-go-stop="${i}">
      <span class="n">${pad(i + 1)}</span><span class="d">${esc(r.name.toUpperCase())}</span><span class="h">${esc(r.highlight || '—')}</span><span class="g">${r.gate}</span>
      <span><span class="pill ${i === 0 ? 'amber' : 'blue'}">${i === 0 ? 'EMBARCANDO' : 'PRÓXIMA'}</span></span></div>`).join('');
  return `<section class="slide" data-chrome="itin">
    <div class="h2 rise" style="--i:0">Itinerario de vuelo</div>
    <div class="sub2 big rise" style="--i:1">Siete paradas, un solo recorrido.</div>
    <div class="board"><div class="row head"><span>N°</span><span>DESTINO</span><span>DESTACADO</span><span>PUERTA</span><span>ESTADO</span></div>${rows}</div></section>`;
}

function flapLines(name, max) {
  const lines = []; let cur = '';
  name.toUpperCase().split(' ').forEach((w) => { const t = (cur ? cur + ' ' : '') + w; if (t.length <= max) cur = t; else { lines.push(cur); cur = w; } });
  lines.push(cur); return lines;
}
function depart(st) {
  const lines = flapLines(st.name, 20).map((ln) => `<div class="ln">${[...ln].map((c) => c === ' ' ? '<span class="fl sp"></span>' : `<span class="fl" data-c="${c}">${c}</span>`).join('')}</div>`).join('');
  return `<section class="slide dep" data-stop="${st.idx}" data-chrome="stop" data-status="CAMBIO DE DESTINO" data-color="amber">
    <div class="tag"><span class="dot">●</span> CAMBIO DE DESTINO</div>
    <div class="from">${st.prev ? `DESDE <b>${esc(st.prev.toUpperCase())}</b> · <i>ABORDADA ✓</i>` : 'DESDE <b>ITINERARIO</b>'}</div>
    <div class="flap" aria-label="${esc(st.name)}">${lines}</div>
    <div class="tagline rise" style="--i:6">${esc(st.tagline)}</div>
    <div class="chips"><div class="chip rise" style="--i:7">PARADA ${pad(st.idx + 1)} / ${pad(TOTAL_STOPS)}</div><div class="chip g rise" style="--i:8">PUERTA ${st.gate}</div><div class="chip rise" style="--i:9">VUELO ${st.flight}</div></div></section>`;
}

function pass(st) {
  const t = st.tiles.map((x, i) => st.cols === 2
    ? `<div class="tile h rise" style="--i:${i + 2}"><div class="circ">${ic(x.icon)}</div><div><h4>${esc(x.title)}</h4><p>${esc(x.desc)}</p></div></div>`
    : `<div class="tile v rise" style="--i:${i + 2}">${ic(x.icon)}<h4>${esc(x.title)}</h4><p>${x.desc ? esc(x.desc) : `<b>${esc(x.big)}</b> ${esc(x.rest)}`}</p></div>`).join('');
  return `<section class="slide" data-stop="${st.idx}" data-chrome="stop" data-status="EMBARCANDO" data-color="amber">
    <div class="pass"><div class="main">
      <div class="eyebrow rise" style="--i:0">DESTINO &nbsp;·&nbsp; PARADA ${pad(st.idx + 1)}</div>
      <h2 class="rise" style="--i:1${st.name.length > 20 ? ";font-size:72px" : ""}">${esc(st.name)}</h2><div class="tag rise" style="--i:1">${esc(st.tagline)}</div>
      <div class="tl rise" style="--i:2">${esc(st.tilesLabel)}</div>
      <div class="tiles" style="--c:${st.cols}">${t}</div></div>
      <div class="stub"><div class="k">PUERTA</div><div class="v gate">${st.gate}</div>
        <div class="k">ESTADO</div><div class="v st">EMBARCANDO</div>
        <div class="k">VUELO</div><div class="v fl">${st.flight}</div>
        <div class="k">DESTINO WEB</div><div class="url">${esc(st.urlShort)}</div>
        <img src="assets/barcode_claro.png" alt=""></div></div></section>`;
}

function aporta(st) {
  const big = !st.stats, d = big ? 130 : 100, t = big ? 40 : 34;
  const top = big ? 300 : 550, h = big ? 305 : 180;
  const stats = st.stats ? `<div class="stats">${st.stats.map(([n, l], i) => `<div class="stat rise" style="--i:${i + 2}"><b>${esc(n)}</b><span>${esc(l)}</span></div>`).join('')}</div>` : '';
  const adv = st.adv.map(([i, t1, d1], k) => `<div class="a rise" style="--i:${k + 6};height:${h}px;--d:${d}px;--t:${t}px"><div class="c">${ic(i)}</div><div><h4>${esc(t1)}</h4><p>${esc(d1)}</p></div></div>`).join('');
  return `<section class="slide" data-stop="${st.idx}" data-chrome="stop" data-status="EN VUELO" data-color="blue">
    <div class="h2 rise" style="--i:0">${st.aportaTitle}</div><div class="sub2 rise" style="--i:1">${esc(st.statsLabel || st.name.toUpperCase())}</div>
    ${stats}<div class="adv" style="top:${top}px;grid-template-rows:repeat(2,${h}px)">${adv}</div></section>`;
}

function compare(st) {
  const bars = st.metrics.map((m, i) => {
    const mx = Math.max(...m.v);
    const row = (lab, v, cls) => `<div class="br ${cls}"><span>${lab} <em>${fmt(v)}${m.u}</em></span><div class="tr"><div class="bar" style="--w:${(v / mx * 100).toFixed(1)}%"></div></div></div>`;
    return `<div class="met rise" style="--i:${i + 3}"><div class="t"><b>${esc(m.t)}</b><i>${m.d}</i></div>${row('Antes', m.v[0], 'old')}${row('Ahora', m.v[1], 'now')}</div>`;
  }).join('');
  return `<section class="slide" data-stop="${st.idx}" data-chrome="stop" data-status="EN VUELO" data-color="blue">
    <div class="h2 rise" style="--i:0">${st.aportaTitle}</div>
    <div class="cmp rise" style="--i:1;top:240px"><div class="c old"><div class="k">ANTES</div><h4>${esc(st.before.title)}</h4><small>${esc(st.before.sub)}</small></div>
      <div class="ar">${ic('FaPlane')}</div><div class="c now"><div class="k">AHORA</div><h4>${esc(st.after.title)}</h4><small>${esc(st.after.sub)}</small></div></div>
    <div class="mets" style="top:455px">${bars}</div>
    <div class="foot2 rise" style="--i:8">${esc(st.foot)}</div></section>`;
}

function demo(st) {
  const hasShot = SHOTS.includes(st.id);
  const steps = st.demo.map((s, i) => `<div class="step rise" style="--i:${i + 2}"><i>${i + 1}</i><span>${esc(s)}</span></div>`).join('');
  return `<section class="slide" data-stop="${st.idx}" data-chrome="stop" data-status="EN VIVO" data-color="green" data-demo="${st.id}">
    <div class="h2 rise" style="--i:0">En funcionamiento</div>
    <div class="browser rise" style="--i:1"><div class="bt"><span class="d" style="background:#E8664F"></span><span class="d" style="background:#FFB020"></span><span class="d" style="background:#35C97A"></span>
      <div class="addr">${esc(st.url)}</div>
      ${hasShot ? `<div class="seg"><button data-v="shot" class="on">CAPTURA</button><button data-v="live">EN VIVO</button></div>` : `<div class="seg"><button data-v="live" class="on">EN VIVO</button></div>`}
      <a href="${st.url}" target="_blank" rel="noopener" title="Abrir en pestaña nueva" aria-label="Abrir en pestaña nueva">${ic('FaExternalLinkAlt')}</a></div>
      <div class="bv ${hasShot ? 'shot' : 'live'}">${hasShot ? `<img src="assets/shots/${st.id}.png" alt="Captura de ${esc(st.name)}">` : ''}<div class="ld">CARGANDO PÁGINA…</div><iframe data-src="${st.url}" title="${esc(st.name)}" loading="lazy" referrerpolicy="no-referrer"></iframe></div></div>
    <div class="steps"><div class="t rise" style="--i:1">RECORRIDO DE LA DEMO</div>${steps}
      <div class="cta rise" style="--i:6"><button class="go" data-enter="${st.idx}">ENTRAR A LA PÁGINA ${ic('FaArrowRight')}</button><img class="qr" src="assets/qr_${st.id}.png" alt="Código QR a ${esc(st.urlShort)}"></div>
      <div class="enterhint rise" style="--i:7">Tecla <b>Enter</b> para entrar · <b>Esc</b> para volver</div></div></section>`;
}

function closing() {
  const c = [['FaClipboardCheck', 'ORDENADO', 'Todo en un solo lugar, sin cruces ni datos dispersos'], ['FaChartLine', 'MEDIDO', 'Cifras reales de producción y exports de SAP'], ['FaCalendarAlt', 'PLANIFICADO', 'Cronograma a más de un año y cargas niveladas']];
  return `<section class="slide close" data-chrome="none"><div class="bgimg" style="background-image:url(assets/bg_close.png)"></div>
    <img class="logo rise" style="--i:0" src="assets/logo_blanco.png" alt="Aeropuertos Argentina">
    <div class="eyebrow rise" style="--i:1"><span class="dot">●</span> ATERRIZAJE</div>
    <h1 class="rise" style="--i:2">Mantenimiento más ordenado, medido y planificado</h1>
    <div class="cards">${c.map(([i, t, d], k) => `<div class="card rise" style="--i:${k + 3}"><h4>${ic(i)}${t}</h4><p>${d}</p></div>`).join('')}</div>
    <div class="foot rise" style="--i:6">${TOTAL_STOPS} herramientas de Mantenimiento AEP &nbsp;·&nbsp; un solo recorrido</div></section>`;
}

/* QR de acceso a la presentación: usa la dirección donde esté publicada (si se abre como archivo, la configurada) */
function presentationUrl() {
  if (/^https?:$/.test(location.protocol)) return location.origin + location.pathname.replace(/index\.html$/, '');
  return DATA.presentationUrl;
}
function drawPresentationQR() {
  const url = presentationUrl(), box = document.getElementById('qrpres');
  try { const q = qrcode(0, 'M'); q.addData(url); q.make(); box.innerHTML = q.createSvgTag({ scalable: true, margin: 1, cellSize: 4, alt: 'Código QR para abrir la presentación' }).replace(/fill="black"/g, 'fill="#0A0D10"').replace(/fill="white"/g, 'fill="#F3F7F8"'); } catch (e) { /* queda el PNG estático */ }
  document.getElementById('qrurl').textContent = url.replace(/^https?:\/\//, '');
}

/* ───────── Armado ───────── */
const notesFor = [];
const html = [cover(), itinerary()];
notesFor.push('Apertura. Cada herramienta es una parada de un vuelo: primero un pantallazo, después qué aporta o qué mejoró, y por último la página funcionando en vivo.');
notesFor.push('Itinerario completo: son 7 herramientas del equipo. Se puede hacer clic en cualquier fila para saltar a esa parada.');
STOPS.forEach((st) => {
  html.push(depart(st)); notesFor.push(st.notes.destino);
  html.push(pass(st)); notesFor.push(st.notes.pantallazo);
  html.push(st.kind === 'compare' ? compare(st) : aporta(st)); notesFor.push(st.notes.mejoras);
  html.push(demo(st)); notesFor.push(st.notes.demo);
});
html.push(closing());
notesFor.push('Cierre. Más ordenado (todo en un lugar), más medido (cifras reales) y más planificado (cronograma a más de un año y cargas niveladas).');

document.getElementById('slides').innerHTML = html.join('');
drawPresentationQR();
const slides = [...document.querySelectorAll('.slide')];
const N = slides.length;
let cur = 0;

/* Ruta (tracker) */
const xs = Array.from({ length: TOTAL_STOPS }, (_, i) => 360 + i * (1440 / (TOTAL_STOPS - 1)));
const track = document.getElementById('track');
xs.forEach((x, i) => { const d = document.createElement('div'); d.className = 'stop'; d.style.left = x + 'px'; d.title = ROUTE[i].name; d.onclick = () => go(slides.findIndex((s) => s.dataset.stop == i)); track.appendChild(d); });
const plane = track.querySelector('.plane'); plane.innerHTML = ic('FaPlane');
const doneBar = track.querySelector('.done'); const stopEls = [...track.querySelectorAll('.stop')];

function setChrome(s) {
  const kind = s.dataset.chrome, hdr = document.getElementById('hdr');
  const l = hdr.querySelector('.l'), r = hdr.querySelector('.r');
  hdr.classList.toggle('hide', kind === 'none'); track.classList.toggle('hide', kind !== 'stop');
  if (kind === 'itin') { l.textContent = 'SALIDAS · DEPARTURES'; r.innerHTML = 'NOVIEMBRE 2026'; }
  if (kind === 'stop') {
    const i = +s.dataset.stop, st = STOPS[i];
    l.innerHTML = `<button class="home" title="Volver al itinerario (I)">☰ ITINERARIO</button><span>PARADA ${pad(i + 1)} / ${pad(TOTAL_STOPS)}  ·  PUERTA ${st.gate}</span>`;
    l.querySelector('.home').onclick = () => go(1);
    r.innerHTML = `<span class="pill ${s.dataset.color}"><span class="dot">●</span>${s.dataset.status}</span>`;
    plane.style.left = xs[i] + 'px'; doneBar.style.width = (xs[i] - xs[0]) + 'px';
    stopEls.forEach((e, k) => e.classList.toggle('on', k < i));
  }
}

/* Tablero de salidas: las letras giran hasta quedar en el nuevo destino */
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const ABC = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
function flipIn(sl) {
  sl.querySelectorAll('.fl[data-c]').forEach((t, i) => {
    clearInterval(t._iv); if (reduced) { t.textContent = t.dataset.c; return; }
    let el = 0; const end = 600 + i * 70;
    t._iv = setInterval(() => {
      el += 70;
      if (el >= end) { clearInterval(t._iv); t.textContent = t.dataset.c; }
      else t.textContent = ABC[Math.random() * ABC.length | 0];
      t.classList.remove('flip'); void t.offsetWidth; t.classList.add('flip');
    }, 70);
  });
}

/* Itinerario: refleja por dónde vas (abordada / en curso / próxima) */
let reached = 0;
function updateItin() {
  document.querySelectorAll('.board .row[data-go-stop]').forEach((r) => {
    const i = +r.dataset.goStop, pl = r.querySelector('.pill');
    const state = i < reached ? ['green', 'ABORDADA'] : i === reached ? ['amber', 'EMBARCANDO'] : ['blue', 'PRÓXIMA'];
    pl.className = 'pill ' + state[0]; pl.textContent = state[1]; r.classList.toggle('first', i === reached);
  });
}
document.querySelector('#track .lab').onclick = () => go(1);
document.getElementById('pitin').onclick = () => { exitPage(); go(1); };

/* Demo: captura / en vivo */
function setView(s, v) {
  const bv = s.querySelector('.bv'); if (!bv) return;
  bv.classList.toggle('shot', v === 'shot'); bv.classList.toggle('live', v === 'live');
  s.querySelectorAll('.seg button').forEach((b) => b.classList.toggle('on', b.dataset.v === v));
  const f = bv.querySelector('iframe'); if (v === 'live' && !f.src) f.src = f.dataset.src;
}
slides.forEach((s) => s.querySelectorAll('.seg button').forEach((b) => b.onclick = () => setView(s, b.dataset.v)));

/* Modo página: la herramienta real a pantalla completa, sin perder el hilo de la presentación */
const pageEl = document.getElementById('page'), pbody = pageEl.querySelector('.pbody'), pguide = document.getElementById('pguide');
const pframes = {}; let pageOpen = -1;
function enterPage(i) {
  const st = STOPS[i]; if (!st) return;
  if (!pframes[i]) { const f = document.createElement('iframe'); f.src = st.url; f.title = st.name; f.referrerPolicy = 'no-referrer'; pbody.appendChild(f); pframes[i] = f; }
  Object.entries(pframes).forEach(([k, f]) => f.classList.toggle('on', +k === i));
  pageEl.querySelector('.pt').innerHTML = `PARADA ${pad(i + 1)} / ${pad(TOTAL_STOPS)}<i>·</i>${esc(st.name.toUpperCase())}`;
  document.getElementById('pext').href = st.url;
  document.getElementById('pnext').textContent = i === TOTAL_STOPS - 1 ? 'CERRAR RECORRIDO →' : 'SIGUIENTE PARADA →';
  pguide.innerHTML = `<b class="t">GUION DE LA DEMO</b>` + st.demo.map((d, k) => `<div><i>${k + 1}</i><span>${esc(d)}</span></div>`).join('');
  pguide.classList.remove('on');
  pageEl.classList.add('on'); document.body.classList.add('inpage'); pageOpen = i;
  history.replaceState(null, '', '#/' + (cur + 1) + '/pagina');
}
function exitPage() {
  if (pageOpen < 0) return; pageEl.classList.remove('on'); document.body.classList.remove('inpage'); pageOpen = -1;
  history.replaceState(null, '', '#/' + (cur + 1)); if (document.activeElement) document.activeElement.blur(); window.focus();
}
document.getElementById('pback').onclick = exitPage;
document.getElementById('pguion').onclick = () => pguide.classList.toggle('on');
document.getElementById('pnext').onclick = () => { const i = pageOpen; exitPage(); const k = slides.findIndex((x) => x.dataset.stop == i + 1); go(k >= 0 ? k : N - 1); };
slides.forEach((sl) => {
  sl.querySelectorAll('[data-enter]').forEach((b) => b.onclick = () => enterPage(+b.dataset.enter));
  const img = sl.querySelector('.bv img'); if (img) img.onclick = () => enterPage(+sl.dataset.stop);
});

/* Navegación */
function go(n) {
  if (n < 0 || n >= N || n === cur && slides[cur].classList.contains('active')) return;
  if (pageOpen >= 0) exitPage();
  cur = n;
  slides.forEach((s, i) => { s.classList.toggle('active', i === cur); s.classList.toggle('past', i < cur); });
  const sd = slides[cur].dataset.stop; if (sd !== undefined) reached = Math.max(reached, +sd); if (cur === N - 1) reached = TOTAL_STOPS;
  updateItin();
  setChrome(slides[cur]);
  if (slides[cur].classList.contains('dep')) flipIn(slides[cur]);
  const s = slides[cur]; if (s.dataset.demo && s.querySelector('.bv.live')) setView(s, 'live');
  document.getElementById('count').textContent = `${pad(cur + 1)} / ${pad(N)}`;
  document.getElementById('notes').innerHTML = `<b>NOTAS</b>${esc(notesFor[cur])}`;
  document.getElementById('hint').style.opacity = 0;
  history.replaceState(null, '', '#/' + (cur + 1));
  if (document.activeElement && document.activeElement.tagName === 'IFRAME') document.activeElement.blur();
  window.focus();
}
const next = () => go(cur + 1), prev = () => go(cur - 1);
document.getElementById('next').onclick = next; document.getElementById('prev').onclick = prev;
document.querySelectorAll('[data-go-stop]').forEach((r) => r.onclick = () => go(slides.findIndex((s) => s.dataset.stop == r.dataset.goStop)));
addEventListener('keydown', (e) => {
  if (pageOpen >= 0) { if (e.key === 'Escape') exitPage(); else if (e.key === 'g' || e.key === 'G') pguide.classList.toggle('on'); else if (e.key === 'i' || e.key === 'I') { exitPage(); go(1); } return; }
  if (['Enter', 'ArrowDown'].includes(e.key) && slides[cur].dataset.demo) { e.preventDefault(); enterPage(+slides[cur].dataset.stop); return; }
  if (['ArrowRight', 'PageDown', ' ', 'Enter', 'ArrowDown'].includes(e.key)) { e.preventDefault(); next(); }
  else if (['ArrowLeft', 'PageUp', 'Backspace'].includes(e.key)) { e.preventDefault(); prev(); }
  else if (e.key === 'i' || e.key === 'I') go(1);
  else if (e.key === 'Home') go(0); else if (e.key === 'End') go(N - 1);
  else if (e.key === 'f' || e.key === 'F') { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen?.(); }
  else if (e.key === 'n' || e.key === 'N') document.getElementById('notes').classList.toggle('on');
});
let idle; addEventListener('mousemove', () => { document.body.classList.add('moving'); clearTimeout(idle); idle = setTimeout(() => document.body.classList.remove('moving'), 2500); });
let tx = null;
addEventListener('touchstart', (e) => { tx = e.touches[0].clientX; }, { passive: true });
addEventListener('touchend', (e) => { if (tx === null) return; const dx = e.changedTouches[0].clientX - tx; if (Math.abs(dx) > 60) dx < 0 ? next() : prev(); tx = null; }, { passive: true });

/* Escala del escenario 1920×1080 */
const stage = document.getElementById('stage');
function fit() { const s = Math.min(innerWidth / 1920, innerHeight / 1080); stage.style.transform = `translate(${(innerWidth - 1920 * s) / 2}px,${(innerHeight - 1080 * s) / 2}px) scale(${s})`; }
addEventListener('resize', fit); fit();

const wantPage = /#\/\d+\/pagina/.test(location.hash);
const start = parseInt((location.hash.match(/#\/(\d+)/) || [])[1], 10);
go(Number.isFinite(start) ? Math.min(Math.max(start - 1, 0), N - 1) : 0);
if (wantPage && slides[cur].dataset.demo) enterPage(+slides[cur].dataset.stop);
setTimeout(() => { const h = document.getElementById('hint'); if (h) h.style.opacity = 0; }, 5000);
if (cur === 0) document.getElementById('hint').style.opacity = 1;
</script>
</body>
</html>
